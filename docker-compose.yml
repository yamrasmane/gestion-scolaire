# Environnement de développement : PostgreSQL + Keycloak.
#   docker compose up -d
# Keycloak : http://localhost:8081 (admin / admin) — realm « lycee » importé au démarrage.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lycee
      POSTGRES_PASSWORD: lycee
      POSTGRES_DB: lycee
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lycee -d lycee"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8081
    ports:
      - "8081:8081"
    volumes:
      - ./docker/keycloak/realm-lycee.json:/opt/keycloak/data/import/realm-lycee.json:ro
      - kcdata:/opt/keycloak/data/h2

volumes:
  pgdata:
  kcdata:
